<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="940" viewBox="0 0 680 940" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fc"/>
      <stop offset="1" stop-color="#e9edf7"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5f2"/>
      <stop offset="1" stop-color="#ffe8e0"/>
    </linearGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="680" height="940" fill="url(#bg)"/>
  <rect x="24" y="24" width="632" height="892" rx="24" fill="#ffffff" filter="url(#softshadow)"/>

  <rect x="48" y="48" width="584" height="76" rx="16" fill="url(#titlebar)"/>
  <text x="340" y="90" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">修改版 IEEE 39 节点系统</text>
  <text x="340" y="113" text-anchor="middle" font-size="14" fill="#dbe4ff">New England 10 机 39 节点 · 极热无风（Extreme-Heat / No-Wind）场景</text>

  <text x="52" y="158" font-size="15" font-weight="700" fill="#334155">系统规模</text>
  <rect x="118" y="149" width="514" height="2" fill="#e2e8f0"/>

  <g filter="url(#cardshadow)"><rect x="52" y="170" width="278" height="112" rx="14" fill="#ffffff" stroke="#eef2f9"/></g>
  <rect x="52" y="170" width="6" height="112" rx="3" fill="#2563eb"/>
  <text x="86" y="238" font-size="52" font-weight="800" fill="#2563eb">39</text>
  <text x="196" y="216" font-size="19" font-weight="700" fill="#1e293b">节点</text>
  <text x="196" y="240" font-size="13" fill="#64748b">bus（21 个负荷节点）</text>

  <g filter="url(#cardshadow)"><rect x="350" y="170" width="278" height="112" rx="14" fill="#ffffff" stroke="#eef2f9"/></g>
  <rect x="350" y="170" width="6" height="112" rx="3" fill="#0d9488"/>
  <text x="384" y="238" font-size="52" font-weight="800" fill="#0d9488">46</text>
  <text x="494" y="216" font-size="19" font-weight="700" fill="#1e293b">支路</text>
  <text x="494" y="240" font-size="13" fill="#64748b">含 12 条并网变支路</text>

  <g filter="url(#cardshadow)"><rect x="52" y="298" width="278" height="112" rx="14" fill="#ffffff" stroke="#eef2f9"/></g>
  <rect x="52" y="298" width="6" height="112" rx="3" fill="#ea580c"/>
  <text x="86" y="366" font-size="52" font-weight="800" fill="#ea580c">10</text>
  <text x="196" y="344" font-size="19" font-weight="700" fill="#1e293b">发电机</text>
  <text x="196" y="368" font-size="13" fill="#64748b">额定合计 7150 MW</text>

  <g filter="url(#cardshadow)"><rect x="350" y="298" width="278" height="112" rx="14" fill="#ffffff" stroke="#eef2f9"/></g>
  <rect x="350" y="298" width="6" height="112" rx="3" fill="#7c3aed"/>
  <text x="384" y="366" font-size="52" font-weight="800" fill="#7c3aed">29</text>
  <text x="494" y="338" font-size="19" font-weight="700" fill="#1e293b">节点变压器</text>
  <text x="494" y="360" font-size="13" fill="#64748b">非电源节点</text>
  <text x="494" y="378" font-size="13" fill="#64748b">bus 1-29 各一台</text>

  <text x="52" y="452" font-size="15" font-weight="700" fill="#334155">机组构成</text>
  <rect x="118" y="443" width="514" height="2" fill="#e2e8f0"/>
  <g font-size="15" font-weight="600">
    <rect x="52" y="466" width="132" height="46" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
    <circle cx="76" cy="489" r="7" fill="#475569"/>
    <text x="92" y="494" fill="#334155">火电 <tspan font-weight="800" fill="#1e293b">6</tspan></text>
    <rect x="196" y="466" width="132" height="46" rx="10" fill="#eff6ff" stroke="#dbeafe"/>
    <circle cx="220" cy="489" r="7" fill="#0284c7"/>
    <text x="236" y="494" fill="#334155">水电 <tspan font-weight="800" fill="#1e293b">1</tspan></text>
    <rect x="340" y="466" width="132" height="46" rx="10" fill="#ecfdf5" stroke="#d1fae5"/>
    <circle cx="364" cy="489" r="7" fill="#14b8a6"/>
    <text x="380" y="494" fill="#334155">风电 <tspan font-weight="800" fill="#1e293b">2</tspan></text>
    <rect x="484" y="466" width="148" height="46" rx="10" fill="#fffbeb" stroke="#fef3c7"/>
    <circle cx="508" cy="489" r="7" fill="#f59e0b"/>
    <text x="524" y="494" fill="#334155">光伏 <tspan font-weight="800" fill="#1e293b">1</tspan></text>
  </g>

  <text x="52" y="556" font-size="15" font-weight="700" fill="#dc2626">气象输入 · 极热无风</text>
  <rect x="200" y="547" width="432" height="2" fill="#fee2e2"/>
  <g>
    <rect x="52" y="570" width="184" height="86" rx="14" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="70" y="600" font-size="14" fill="#b91c1c">环境温度 T</text>
    <text x="70" y="640" font-size="34" font-weight="800" fill="#dc2626">40<tspan font-size="18" font-weight="600"> °C</tspan></text>
    <rect x="248" y="570" width="184" height="86" rx="14" fill="#f0f9ff" stroke="#e0f2fe"/>
    <text x="266" y="600" font-size="14" fill="#0369a1">风速 v</text>
    <text x="266" y="640" font-size="34" font-weight="800" fill="#0284c7">2<tspan font-size="18" font-weight="600"> m/s</tspan></text>
    <rect x="444" y="570" width="188" height="86" rx="14" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="462" y="600" font-size="14" fill="#b45309">辐照度 G</text>
    <text x="462" y="640" font-size="34" font-weight="800" fill="#d97706">900<tspan font-size="16" font-weight="600"> W/m²</tspan></text>
  </g>

  <rect x="48" y="686" width="584" height="196" rx="18" fill="url(#alert)" stroke="#fecaca"/>
  <text x="72" y="722" font-size="17" font-weight="800" fill="#991b1b">源-荷供需失衡（DC-OPF 基准结果）</text>

  <text x="120" y="778" text-anchor="middle" font-size="14" fill="#475569">极热修正总需求</text>
  <text x="120" y="812" text-anchor="middle" font-size="30" font-weight="800" fill="#1e293b">6754.6</text>
  <text x="120" y="834" text-anchor="middle" font-size="13" fill="#64748b">MW</text>

  <text x="228" y="800" text-anchor="middle" font-size="30" font-weight="700" fill="#94a3b8">-</text>

  <text x="340" y="778" text-anchor="middle" font-size="14" fill="#475569">系统实际供电</text>
  <text x="340" y="812" text-anchor="middle" font-size="30" font-weight="800" fill="#1e293b">5991.8</text>
  <text x="340" y="834" text-anchor="middle" font-size="13" fill="#64748b">MW</text>

  <text x="452" y="800" text-anchor="middle" font-size="30" font-weight="700" fill="#94a3b8">=</text>

  <rect x="500" y="742" width="112" height="118" rx="14" fill="#dc2626"/>
  <text x="556" y="770" text-anchor="middle" font-size="14" fill="#fecaca">硬缺口 · 切负荷</text>
  <text x="556" y="808" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">762.8</text>
  <text x="556" y="830" text-anchor="middle" font-size="13" fill="#fecaca">MW</text>
  <text x="556" y="850" text-anchor="middle" font-size="15" font-weight="800" fill="#ffe4e6">11.29%</text>
</svg>
